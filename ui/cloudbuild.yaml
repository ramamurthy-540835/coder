steps:
  # 1. Build the Docker container for the Dashboard UI
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/ctoteam/cloud-run-repo/coding-agent-dashboard:latest',
      '-f', 'ui/Dockerfile',
      '.'
    ]

  # 2. Push the container to GCP Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/ctoteam/cloud-run-repo/coding-agent-dashboard:latest'
    ]

  # 3. Deploy the container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run',
      'deploy', 'coding-agent-dashboard',
      '--image', 'us-central1-docker.pkg.dev/ctoteam/cloud-run-repo/coding-agent-dashboard:latest',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]
